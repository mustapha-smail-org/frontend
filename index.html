<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /*
       * Applies the saved theme before first paint, so a dark-mode user never
       * sees a white flash while the JS bundle loads. Kept in sync with
       * src/shared/theme/theme.ts.
       */
      ;(function () {
        try {
          var stored = localStorage.getItem('citypulse.theme')
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || stored === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* Storage blocked: fall back to the light default. */
        }
      })()
    </script>
    <title>CityPulse — Events in Paris</title>
    <meta
      name="description"
      content="Discover what is happening in Paris. Search and filter upcoming events by date, category, price and arrondissement, and compare them on a map."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Runtime config, overwritten by the container entrypoint at deploy time
      (see docker/entrypoint.sh). Must load before the app bundle so
      window.__APP_CONFIG__ is set when src/shared/config/env.ts runs.
    -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
