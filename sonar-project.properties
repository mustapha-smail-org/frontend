# Structural Sonar config for the Node/TypeScript stack. Identity
# (projectKey/projectName/organization) and the quality-gate wait are passed
# as CLI args by deployment-workflows' sonar-analysis-node action instead.

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx
sonar.exclusions=src/**/*.d.ts,src/theme/**,next-env.d.ts
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/app/**,src/components/**,src/theme/**,src/**/*.d.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
