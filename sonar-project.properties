# Structural Sonar config for the Node/TypeScript stack. Identity
# (projectKey/projectName/organization) and the quality-gate wait are passed
# as CLI args by deployment-workflows' sonar-analysis-node action instead —
# see deployment-workflows/docs/WORKFLOW_CONTRACTS.md.

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx
sonar.exclusions=src/components/ui/**,src/**/*.d.ts,src/main.tsx
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/test/**,src/main.tsx,src/components/ui/**,src/**/*.d.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
